<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>המאסטרים - סרטוני אומנויות לחימה וקונג-פו</title>
    <meta name="description" content="גלריית וידאו של אומנויות לחימה. צפו ב-30 קטעי לחימה נבחרים של ג'קי צ'אן ומאסטרים אחרים.">
    <meta name="keywords" content="אומנויות לחימה, קונג פו, סרטוני לחימה קצרים, טכניקות קרב, ג'קי צ'אן, מאיר ישראל">
    <meta name="author" content="מאיר ישראל">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #eeeeee;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #262626;
            padding: 25px;
            text-align: center;
            border-bottom: 3px solid #e50914;
        }
        h1 {
            margin: 0;
            font-size: 2.2em;
        }
        .container {
            padding: 30px 15px;
            max-width: 650px; 
            margin: 0 auto;
        }
        .video-grid {
            display: grid;
            grid-template-columns: 1fr; 
            gap: 40px;
        }
        .video-card {
            background-color: #333333;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            /* יחס של 5:4 - ממש טיפה מלבני */
            aspect-ratio: 5 / 4; 
            object-fit: cover;
            display: block;
            background-color: #000;
        }
        .video-info {
            padding: 18px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            border-top: 1px solid #444;
        }

        /* עיצוב כפתור הגלילה למטה */
        .scroll-down-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: background-color 0.3s;
            z-index: 1000;
        }
        .scroll-down-btn:hover {
            background-color: #bf0811;
        }
    </style>
</head>
<body>

    <header>
        <h1>המאסטרים - קטעי לחימה</h1>
    </header>

    <div class="container">
        <div class="video-grid">
            <script>
                // יצירת 30 כרטיסיות הסרטונים 
                for (let i = 1; i <= 30; i++) {
                    document.write(`
                        <div class="video-card">
                            <video controls controlsList="nodownload" oncontextmenu="return false;" preload="metadata">
                                <source src="${i}.mp4" type="video/mp4">
                            </video>
                            <div class="video-info">
                                סרטון מאסטר - קטע ${i}
                            </div>
                        </div>
                    `);
                }
            </script>
        </div>
    </div>

    <button class="scroll-down-btn" onclick="scrollToBottom()">⬇ לסוף הדף</button>

    <script>
        function scrollToBottom() {
            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: 'smooth'
            });
        }
    </script>

</body>
</html>
